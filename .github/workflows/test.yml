name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1000

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Bundling the JavaScript that ships inside Nacara.Theme.Default and
      # Nacara.Plugin.LiveExample needs esbuild, and Biome formats the css and the javascript.
      # ./build.sh installs them itself; this is what pins node and caches the download.
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Restore
        run: dotnet restore Nacara.slnx

      # The tree-sitter plugin talks to two native libraries that no one publishes prebuilt. A
      # site fetches them from npm; this repository builds its own, cached on the versions that
      # decide their contents. Every platform is built by .github/workflows/native-runtimes.yml.
      - name: Cache the tree-sitter runtime
        id: runtime
        uses: actions/cache@v4
        with:
          path: src/Nacara.Plugin.Highlight.TreeSitter/runtimes
          key: tree-sitter-runtime-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-${{ hashFiles('build/Commands/TreeSitter/Runtime.fs', 'src/Nacara.Plugin.Highlight.TreeSitter/Runtime.fs') }}

      - name: Build the tree-sitter runtime
        if: steps.runtime.outputs.cache-hit != 'true'
        run: ./build.sh tree-sitter runtime

      - name: Test
        run: ./build.sh test

      - name: Build the documentation
        # `check` renders everything and writes nothing, so a broken link or an unknown
        # directive fails the pipeline while nothing is produced to upload. It fails on
        # errors; `--strict` would fail on warnings too, which the docs do not pass yet.
        run: ./build.sh docs check

      - name: Restore the formatters
        run: dotnet tool restore

      - name: Check formatting
        run: ./build.sh format --check
